# Anatomy data attribution

BodyParts3D, © The Database Center for Life Science licensed under CC Attribution 4.0 International.

- License: https://dbarchive.biosciencedbc.jp/en/bodyparts3d/lic.html (updated 2025-02-27)
- Dataset: https://dbarchive.biosciencedbc.jp/en/bodyparts3d/download.html
- License terms: https://creativecommons.org/licenses/by/4.0/
- Source geometry: `isa_BP3D_4.0_obj_99.zip`, BodyParts3D 4.0.
- English names and relationships: IS-A and PART-OF concept, element, and inclusion tables from the same archive.
- Publication: Mitsuhashi et al. (2009), BodyParts3D: 3D structure database for anatomical concepts. https://doi.org/10.1093/nar/gkn613

Adaptations: axes and units converted from millimeters/Z-up to meters/Y-up; translated to rest at the stage; geometry simplified using meshoptimizer with 0.2% relative error limit per structure; normals quantized to signed 16-bit; packed into binary chunks; curated display system groupings and colors. The source contains 2,234 individual OBJ meshes; all remain represented. The combined hierarchy contains 3,432 named FMA concepts, which may reference multiple meshes. Original source identity is preserved in the manifest.

Source OBJ comments mention an older CC BY-SA 2.1 Japan license. The official current database license linked above supersedes that legacy text and explicitly permits redistribution and adaptation under CC BY 4.0.

BodyParts3D represents an adult male reference anatomy based on TARO MRI and anatomical illustration refinements. It is not a complete model of every possible human anatomical structure or variation. This interface is educational and is not a clinical tool.

## Historical assets (not included in the current release)

Earlier repository revisions included female reference anatomy: Kristen Browne and Heidi Schlehlein, Human Reference Atlas / HuBMAP, *3D Reference Organ Set for Female v1.5* (2023). CC BY 4.0. Geometry adapted for this viewer.

- Source DOI: https://doi.org/10.48539/HBM352.BTSQ.586
- Dataset: https://lod.humanatlas.io/ref-organ/united-female/v1.5
- Original GLB: https://cdn.humanatlas.io/digital-objects/ref-organ/united-female/v1.5/assets/3d-vh-f-united.glb
- License: https://creativecommons.org/licenses/by/4.0/

Adaptations: translated native meter/Y-up coordinates onto the stage, coincident vertices welded and source normals averaged, geometry simplified with a 0.2% per-structure relative error bound, and normals quantized. Colors and display systems are curated for this interface. All 888 source meshes are represented, with 1,073 source nodes available as selectable individual or compound concepts.

This is a reference assembly with whole-body surface and selected organs, including female reproductive anatomy. Its skeleton and muscle coverage is partial. It is not a complete model of every human structure or a single-person scan. Eight placenta/umbilical structures are classified under Pregnancy reference and hidden by default.

## Brain Pain Atlas head adaptation

The approximate-location head uses Human Atlas source meshes FJ2810 (Skin), FJ2811 (External ear), FJ1317 (Left sclera), and FJ1368 (Right sclera). Meshes are clipped at the upper neck. Skin and ear surfaces receive two Loop subdivision passes; vertices are centered and normals recomputed. Triangles are grouped into 24 broad, application-defined regions for marking sensations. These are interface regions rather than additional anatomical structures. The resulting head contains 140,484 triangles.

# Full-body anatomy attribution

BodyParts3D, © The Database Center for Life Science licensed under CC Attribution 4.0 International.

- Dataset and license: https://dbarchive.biosciencedbc.jp/en/bodyparts3d/lic.html
- Original geometry and metadata: https://dbarchive.biosciencedbc.jp/en/bodyparts3d/download.html
- License terms: https://creativecommons.org/licenses/by/4.0/
- Source publication: Mitsuhashi et al. (2009), https://doi.org/10.1093/nar/gkn613

The full-body assets were copied from [ashemag/human-atlas](https://github.com/ashemag/human-atlas), commit `1c38bf35c254a891200d3cedecfd57abebe83d8d`. Its application code, including the batched geometry and per-structure texture rendering approach adapted here, is MIT licensed; the complete copyright notice is retained in `UPSTREAM-LICENSE.txt`.

The assets represent the BodyParts3D 4.0 adult male reference. All 2,234 original structure meshes and 3,432 named concepts are retained. The model contains 2,288,268 triangles. This reference does not represent every anatomical structure or individual variation.

Upstream adaptations: millimeters/Z-up converted to meters/Y-up, repositioning onto a stage, meshoptimizer simplification with a 0.2% relative error limit per structure, signed 16-bit normals, binary chunk packing, and curated display systems.

Adaptations in this application: relative asset paths, the `body-` prefix on application record identifiers while retaining original `FJ` and `FMA` source identifiers, neutral system colors, translated common structure labels with original English names retained, pain annotation colors, and camera focus and restoration. Regional packages clip original triangles at geographic body-zone boundaries. Interior surfaces and structure identifiers are preserved; new boundary vertices remain on the original faces with interpolated normals, and no caps are added. Structures crossing a region boundary may appear partially. The original source meshes remain in the source asset directory. The viewer loads only the chosen regional package and uses the original two-stage system separation and individual structure layout from Human Atlas. Skin and hair are hidden initially and can be enabled through system controls. The entry diagram, location zones and pain labels are interface additions.

The original `BODYPARTS3D-ATTRIBUTION.md` contains the inherited dataset notes and source links. Structure selection and pain markings are records and anatomical references; they do not establish a diagnosis.
